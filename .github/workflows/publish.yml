name: publish

# PyPI 发布走 OIDC 可信发布（Trusted Publishing），不存任何长期 API token。
# 触发：手动 workflow_dispatch，或推 v* tag。
# 前置：PyPI 账号里已登记 pending publisher（项目尚不存在时用）——
#   PyPI Project Name: mcp-guard
#   Owner: aidless
#   Repository name: mcp-guard
#   Workflow name: publish.yml
#   Environment name: （留空，必须与本文件不写 environment 一致）
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Show artifact digests
        run: sha256sum dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
