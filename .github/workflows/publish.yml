name: publish

# PyPI 发布走 OIDC 可信发布（Trusted Publishing），不存任何长期 API token。
# 触发：手动 workflow_dispatch，或推 v* tag。
# 前置：PyPI 账号里已登记 pending publisher（项目尚不存在时用）——
#   PyPI Project Name: mcp-guard-scan   （原名 mcp-guard 与既有 mcpguard 撞名，永久不可用）
#   Owner: aidless
#   Repository name: mcp-guard
#   Workflow name: publish.yml
#   Environment name: （留空，必须与本文件不写 environment 一致）
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Show artifact digests
        run: sha256sum dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086/v1
