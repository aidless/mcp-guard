name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q
      - name: Stdio proxy integration tests
        run: python -m pytest tests/test_proxy.py -q
      - name: Capability rulepack agrees with agent-desktop case ledger
        run: python scripts/capability_crosscheck.py
      - name: Every rule in the pack demonstrably fires (prove-red battery)
        run: python scripts/rule_prove_red.py
      - run: python run_eval.py --offline
      - name: README ablation numbers stay recomputable
        run: python scripts/measure_rule_ablation.py --check
      - name: Benign corpus stays false-positive free (and the bound is reported)
        run: python scripts/fp_upper_bound.py --out fp_bound.json --check
      - name: Cross-tool checks stay silent on real published servers
        run: python -m pytest tests/test_cross_tool.py -q
